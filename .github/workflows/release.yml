name: Build and release

on:
  push:
    branches:
      - '**'
    tags:
      - '**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Build toolchain image
        run: docker build -t qua-rescue-builder .
      - name: Build rescue firmware
        run: docker run --rm --user "$(id -u):$(id -g)" -v "$PWD:/src" qua-rescue-builder bash scripts/build-rescue.sh profiles/release-build.json
      - name: Prepare release assets
        run: |
          mkdir -p out/release
          cp out/package/u-boot-ram-console.bin out/release/
          cd out/release
          sha256sum u-boot-ram-console.bin > SHA256SUMS
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: qua-rescue-uboot-${{ github.sha }}
          path: out/release/*
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" out/release/* --verify-tag --generate-notes
